<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Обучальник программированию</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #f0f4fa;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .lives {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .lives span { color: #ef4444; }
        .restore-btn {
            background: #22c55e;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .timer { font-size: 14px; color: #94a3b8; margin-left: auto; }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .menu-btn {
            background: #1e293b;
            padding: 20px 10px;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 4px solid #f97316;
            text-align: center;
        }
        .menu-btn:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        .back-btn {
            background: none;
            border: none;
            color: #f97316;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            padding: 6px 0;
        }
        .progress-bar {
            background: #1e293b;
            height: 8px;
            border-radius: 20px;
            margin: 12px 0 16px;
            overflow: hidden;
        }
        .progress-fill {
            background: #f97316;
            height: 100%;
            width: 0%;
            transition: width 0.4s;
        }
        .lesson-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 24px 20px;
        }
        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .theory {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            border-left: 4px solid #f97316;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .task-box {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            margin-top: 12px;
        }
        .task-box .question {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .task-instruction {
            font-size: 15px;
            color: #e2e8f0;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            line-height: 1.7;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: 1px solid #334155;
        }
        .input-area input:focus { outline: 2px solid #f97316; }
        .input-area button {
            padding: 14px 24px;
            border: none;
            border-radius: 40px;
            background: #f97316;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            background: #334155;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            background: #475569;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .feedback {
            margin: 12px 0;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }
        .correct { color: #4ade80; }
        .wrong { color: #f87171; }
        .info { color: #60a5fa; }
        .intro-text {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            border-left: 4px solid #f59e0b;
            white-space: pre-wrap;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="lives" id="livesDisplay">
        ❤️ <span id="livesCount">3</span>
        <button class="restore-btn" id="restoreBtn">+ Восстановить</button>
        <span class="timer" id="timerDisplay">⏳ 10:00</span>
    </div>

    <div id="menuScreen">
        <h1 style="text-align:center;">🧠 Обучальник</h1>
        <div style="text-align:center;color:#94a3b8;margin-bottom:20px;">Выбери язык</div>
        <div class="menu-grid">
            <button class="menu-btn" data-lang="html">🟧 HTML</button>
            <button class="menu-btn" data-lang="css">🟦 CSS</button>
            <button class="menu-btn" data-lang="js">🟨 JS</button>
            <button class="menu-btn" data-lang="python">🐍 Python</button>
        </div>
        <div style="text-align:center;color:#64748b;font-size:14px;margin-top:20px;">Прогресс и жизни сохраняются</div>
    </div>

    <div id="lessonScreen">
        <button class="back-btn" id="backBtn">← Назад к выбору</button>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="lesson-card">
            <div class="lesson-title" id="lessonTitle">Загрузка...</div>
            <div id="contentArea"></div>
            <div id="taskArea" class="hidden">
                <div class="task-box">
                    <div class="question" id="taskQuestion">Задание</div>
                    <div class="task-instruction" id="taskInstruction">Инструкция</div>
                    <div class="input-area">
                        <input type="text" id="userInput" placeholder="Введи код...">
                        <button id="checkBtn">Проверить</button>
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="action-buttons">
                        <button class="action-btn" id="hintBtn">💡 Подсказка</button>
                        <button class="action-btn" id="revealBtn">👀 Ответ</button>
                    </div>
                    <div class="nav-buttons">
                        <button class="nav-btn" id="prevBtn">◀ Назад</button>
                        <button class="nav-btn" id="skipBtn">⏩ Пропустить</button>
                        <button class="nav-btn" id="nextBtn">Следующий ▶</button>
                    </div>
                </div>
            </div>
            <button class="nav-btn" id="startBtn" style="display:none; width:100%;">🚀 Начать обучение</button>
        </div>
        <div class="footer">Учись и не теряй жизни 😉</div>
    </div>

    <script>
        // ============================================================
        //  БАЗА УРОКОВ (по 10 на каждый язык)
        // ============================================================
        const COURSES = {
            html: {
                name: 'HTML',
                intro: `🌟 **Что такое HTML?**  
        HTML — это язык разметки, который создаёт скелет любой веб-страницы.  
        Теги — это команды в угловых скобках. Большинство тегов парные: открывающий и закрывающий.  
        Будь внимателен — забытый закрывающий тег ломает всю страницу.`,
                lessons: [
                    { title: 'Заголовки h1-h6', theory: 'Заголовки выделяют важные разделы. <h1> — самый главный, <h6> — самый мелкий.\nПример: <h1>Главный заголовок</h1>', task: 'Создай заголовок h1 с текстом "Мой сайт"', answer: '<h1>Мой сайт</h1>', hint: 'Используй h1', instruction: '1. <h1>\n2. Мой сайт\n3. </h1>' },
                    { title: 'Абзацы p', theory: 'Абзац — <p> ... </p>. Группирует текст.\nПример: <p>Это абзац.</p>', task: 'Создай абзац "Первый урок"', answer: '<p>Первый урок</p>', hint: 'p', instruction: '<p>Первый урок</p>' },
                    { title: 'Жирный и курсив', theory: '<b>жирный</b>, <i>курсив</i>. Оборачивают текст.\nПример: Это <b>важно</b>.', task: 'Сделай слово "код" жирным', answer: '<b>код</b>', hint: 'b', instruction: '<b>код</b>' },
                    { title: 'Ссылки a', theory: '<a href="url">текст</a>. Создаёт кликабельную ссылку.\nПример: <a href="https://ya.ru">Яндекс</a>', task: 'Ссылка на google.com с текстом "Поиск"', answer: '<a href="https://google.com">Поиск</a>', hint: 'a href', instruction: '<a href="https://google.com">Поиск</a>' },
                    { title: 'Картинки img', theory: '<img src="путь"> — одиночный тег.\nПример: <img src="photo.jpg">', task: 'Вставь картинку "cat.jpg"', answer: '<img src="cat.jpg">', hint: 'img src', instruction: '<img src="cat.jpg">' },
                    { title: 'Списки ul, ol', theory: '<ul> — ненумерованный, <ol> — нумерованный. Внутри <li>.\nПример: <ul><li>Пункт</li></ul>', task: 'Создай нумерованный список с пунктами "Первый", "Второй"', answer: '<ol><li>Первый</li><li>Второй</li></ol>', hint: 'ol li', instruction: '<ol><li>Первый</li><li>Второй</li></ol>' },
                    { title: 'Таблицы table', theory: 'Таблица: <table>, строки <tr>, ячейки <td>.\nПример: <table><tr><td>A</td><td>B</td></tr></table>', task: 'Таблица с одной строкой и ячейками "X" и "Y"', answer: '<table><tr><td>X</td><td>Y</td></tr></table>', hint: 'table tr td', instruction: '<table><tr><td>X</td><td>Y</td></tr></table>' },
                    { title: 'Горизонтальная линия hr', theory: '<hr> — разделительная линия. Одиночный тег.', task: 'Вставь горизонтальную линию', answer: '<hr>', hint: 'hr', instruction: '<hr>' },
                    { title: 'Перенос строки br', theory: '<br> — перенос на новую строку. Одиночный тег.', task: 'Напиши "Привет" и с новой строки "Мир"', answer: 'Привет<br>Мир', hint: 'br', instruction: 'Привет<br>Мир' },
                    { title: 'Комментарии <!-- -->', theory: 'Комментарий не отображается. <!-- текст -->\nПример: <!-- это комментарий -->', task: 'Напиши комментарий "скрыто"', answer: '<!-- скрыто -->', hint: '<!-- -->', instruction: '<!-- скрыто -->' }
                ]
            },
            css: {
                name: 'CSS',
                intro: `🎨 **Что такое CSS?**  
        CSS — это каскадные таблицы стилей. Он отвечает за внешний вид: цвета, шрифты, отступы.  
        Правило CSS: селектор { свойство: значение; }  
        Например, p { color: red; } — все параграфы станут красными.`,
                lessons: [
                    { title: 'Цвет текста color', theory: 'color: red; — меняет цвет текста.\nПример: p { color: blue; }', task: 'Сделай заголовки h1 синими', answer: 'h1 { color: blue; }', hint: 'color', instruction: 'h1 { color: blue; }' },
                    { title: 'Цвет фона background-color', theory: 'background-color: yellow; — заливка.\nПример: body { background-color: #f0f0f0; }', task: 'Сделай фон страницы зелёным', answer: 'body { background-color: green; }', hint: 'background-color', instruction: 'body { background-color: green; }' },
                    { title: 'Размер шрифта font-size', theory: 'font-size: 20px; — размер текста.\nПример: p { font-size: 16px; }', task: 'Установи размер шрифта 24px для h1', answer: 'h1 { font-size: 24px; }', hint: 'font-size', instruction: 'h1 { font-size: 24px; }' },
                    { title: 'Жирность font-weight', theory: 'font-weight: bold; — жирный шрифт.\nПример: p { font-weight: bold; }', task: 'Сделай все абзацы жирными', answer: 'p { font-weight: bold; }', hint: 'font-weight', instruction: 'p { font-weight: bold; }' },
                    { title: 'Выравнивание text-align', theory: 'text-align: center; — по центру. Варианты: left, right, justify.\nПример: h1 { text-align: center; }', task: 'Выровняй h2 по центру', answer: 'h2 { text-align: center; }', hint: 'text-align', instruction: 'h2 { text-align: center; }' },
                    { title: 'Рамка border', theory: 'border: 1px solid black; — рамка.\nПример: p { border: 2px solid red; }', task: 'Добавь красную рамку 2px для параграфов', answer: 'p { border: 2px solid red; }', hint: 'border', instruction: 'p { border: 2px solid red; }' },
                    { title: 'Внутренний отступ padding', theory: 'padding: 10px; — отступ внутри элемента.\nПример: div { padding: 20px; }', task: 'Дай всем параграфам внутренний отступ 15px', answer: 'p { padding: 15px; }', hint: 'padding', instruction: 'p { padding: 15px; }' },
                    { title: 'Внешний отступ margin', theory: 'margin: 10px; — отступ снаружи.\nПример: p { margin: 20px; }', task: 'Установи внешний отступ 10px для заголовков h1', answer: 'h1 { margin: 10px; }', hint: 'margin', instruction: 'h1 { margin: 10px; }' },
                    { title: 'Скругление углов border-radius', theory: 'border-radius: 10px; — закругление.\nПример: div { border-radius: 8px; }', task: 'Сделай скругление 12px для всех абзацев', answer: 'p { border-radius: 12px; }', hint: 'border-radius', instruction: 'p { border-radius: 12px; }' },
                    { title: 'Тень box-shadow', theory: 'box-shadow: 5px 5px 10px gray; — тень.\nПример: div { box-shadow: 2px 2px 5px black; }', task: 'Добавь тень для h1: сдвиг 3px 3px, размытие 6px, цвет чёрный', answer: 'h1 { box-shadow: 3px 3px 6px black; }', hint: 'box-shadow', instruction: 'h1 { box-shadow: 3px 3px 6px black; }' }
                ]
            },
            js: {
                name: 'JS',
                intro: `⚡ **Что такое JavaScript?**  
        JavaScript — это язык программирования, который добавляет интерактивность на веб-страницы: всплывающие окна, анимации, обработка нажатий.  
        Код пишется в виде инструкций. Важно: регистр букв имеет значение (console.log, а не Console.Log).`,
                lessons: [
                    { title: 'Вывод console.log', theory: 'console.log(\'текст\'); — выводит в консоль.\nПример: console.log(\'Привет\');', task: 'Выведи "Hello, JS!"', answer: "console.log('Hello, JS!');", hint: 'console.log', instruction: "console.log('Hello, JS!');" },
                    { title: 'Переменная let', theory: 'let x = 5; — объявление переменной.\nПример: let name = \'Анна\';', task: 'Создай переменную age со значением 25', answer: 'let age = 25;', hint: 'let', instruction: 'let age = 25;' },
                    { title: 'Условный if', theory: 'if (условие) { ... } — проверка.\nПример: if (x > 10) { console.log(\'Да\'); }', task: 'Если x > 5, вывести "Больше"', answer: 'if (x > 5) { console.log("Больше"); }', hint: 'if', instruction: 'if (x > 5) { console.log("Больше"); }' },
                    { title: 'Функция function', theory: 'function имя() { ... } — блок кода.\nПример: function sayHi() { console.log(\'Hi\'); }', task: 'Создай функцию showMsg, которая выводит "Привет"', answer: 'function showMsg() { console.log("Привет"); }', hint: 'function', instruction: 'function showMsg() { console.log("Привет"); }' },
                    { title: 'Цикл for', theory: 'for (let i=0; i<3; i++) { ... } — повтор.\nПример: for (let i=0; i<3; i++) { console.log(i); }', task: 'Выведи числа 0,1,2 через цикл for', answer: 'for (let i=0; i<3; i++) { console.log(i); }', hint: 'for', instruction: 'for (let i=0; i<3; i++) { console.log(i); }' },
                    { title: 'Массив []', theory: 'let arr = [1, 2, 3]; — список.\nДоступ: arr[0] — первый элемент.', task: 'Создай массив с числами 10, 20, 30', answer: '[10, 20, 30]', hint: 'квадратные скобки', instruction: '[10, 20, 30]' },
                    { title: 'Объект {}', theory: 'let obj = { key: \'value\' }; — хранит пары.\nПример: let person = { name: \'Anna\' };', task: 'Создай объект с полями title: "Книга", pages: 200', answer: '{ title: "Книга", pages: 200 }', hint: 'фигурные скобки', instruction: '{ title: "Книга", pages: 200 }' },
                    { title: 'Оператор + (сложение)', theory: 'let sum = a + b; — складывает числа или строки.\nПример: let x = 5 + 3;', task: 'Напиши выражение, складывающее 7 и 3', answer: '7 + 3', hint: '+', instruction: '7 + 3' },
                    { title: 'Строковые кавычки', theory: 'Можно использовать \' или ".\nПример: let s = "Привет";', task: 'Создай строку "JavaScript" в кавычках', answer: '"JavaScript"', hint: 'кавычки', instruction: '"JavaScript"' },
                    { title: 'alert()', theory: 'alert(\'текст\'); — показывает всплывающее окно.\nПример: alert(\'Привет!\');', task: 'Выведи alert с текстом "Hello"', answer: 'alert("Hello");', hint: 'alert', instruction: 'alert("Hello");' }
                ]
            },
            python: {
                name: 'Python',
                intro: `🐍 **Что такое Python?**  
        Python — это высокоуровневый язык программирования, известный своей простотой и читаемостью. Используется для веба, анализа данных, автоматизации.  
        В Python важны отступы (пробелы) — они заменяют фигурные скобки.`,
                lessons: [
                    { title: 'print()', theory: 'print(\'текст\') — выводит на экран.\nПример: print(\'Привет\')', task: 'Выведи "Hello, Python!"', answer: "print('Hello, Python!')", hint: 'print', instruction: "print('Hello, Python!')" },
                    { title: 'Переменная', theory: 'name = \'Анна\' — присваивание.\nТип определяется автоматически.', task: 'Создай переменную age = 30', answer: 'age = 30', hint: 'присвоить', instruction: 'age = 30' },
                    { title: 'if', theory: 'if условие: (с отступом)\nПример: if x > 10: print(\'Больше\')', task: 'Если age > 18, вывести "Взрослый"', answer: 'if age > 18:\n    print("Взрослый")', hint: 'if', instruction: 'if age > 18:\n    print("Взрослый")' },
                    { title: 'for range', theory: 'for i in range(3): — цикл 0,1,2.\nПример: for i in range(3): print(i)', task: 'Выведи числа 0,1,2 через for', answer: 'for i in range(3):\n    print(i)', hint: 'for range', instruction: 'for i in range(3):\n    print(i)' },
                    { title: 'def функция', theory: 'def имя(): — объявление функции.\nПример: def hello(): print(\'Hi\')', task: 'Создай функцию greet, печатающую "Привет"', answer: 'def greet():\n    print("Привет")', hint: 'def', instruction: 'def greet():\n    print("Привет")' },
                    { title: 'Список list', theory: 'list = [1, 2, 3] — коллекция.\nПример: fruits = [\'яблоко\', \'банан\']', task: 'Создай список [5, 10, 15]', answer: '[5, 10, 15]', hint: 'квадратные скобки', instruction: '[5, 10, 15]' },
                    { title: 'Словарь dict', theory: 'dict = { \'ключ\': \'значение\' } — пары.\nПример: person = {\'name\': \'Anna\'}', task: 'Создай словарь с ключами "city": "Москва", "country": "Россия"', answer: '{"city": "Москва", "country": "Россия"}', hint: 'фигурные скобки', instruction: '{"city": "Москва", "country": "Россия"}' },
                    { title: 'len()', theory: 'len(список) — возвращает длину.\nПример: len([1,2,3]) → 3', task: 'Напиши выражение len() для списка [1,2,3]', answer: 'len([1,2,3])', hint: 'len', instruction: 'len([1,2,3])' },
                    { title: 'type()', theory: 'type(переменная) — показывает тип.\nПример: type(5) → int', task: 'Напиши type() для числа 42', answer: 'type(42)', hint: 'type', instruction: 'type(42)' },
                    { title: 'input()', theory: 'input(\'Вопрос\') — получает текст от пользователя.\nПример: name = input(\'Как тебя зовут?\')', task: 'Напиши input с вопросом "Как дела?"', answer: 'input("Как дела?")', hint: 'input', instruction: 'input("Как дела?")' }
                ]
            }
        };

        // ============================================================
        //  УПРАВЛЕНИЕ СОСТОЯНИЕМ И ЖИЗНЯМИ
        // ============================================================
        let state = {
            currentLang: 'html',
            lessonIndex: { html: 0, css: 0, js: 0, python: 0 },
            completed: { html: 0, css: 0, js: 0, python: 0 },
            lives: 3,
            lastLostTime: Date.now()
        };

        function loadState() {
            try {
                const saved = localStorage.getItem('learnState');
                if (saved) state = { ...state, ...JSON.parse(saved) };
            } catch(e) {}
        }
        function saveState() { localStorage.setItem('learnState', JSON.stringify(state)); }

        function updateLivesDisplay() {
            document.getElementById('livesCount').textContent = state.lives;
            const timerEl = document.getElementById('timerDisplay');
            if (state.lives >= 3) { timerEl.textContent = '✅ Максимум'; return; }
            const diff = 10 * 60 * 1000 - (Date.now() - state.lastLostTime);
            if (diff <= 0) timerEl.textContent = '⏳ 0:00 (доступно)';
            else {
                const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                timerEl.textContent = `⏳ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
        }

        function showFeedback(text, type='info') {
            const fb = document.getElementById('feedback');
            fb.textContent = text;
            fb.className = 'feedback ' + type;
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ УРОКОВ
        // ============================================================
        let currentLessonObj = null;
        let currentLessonIndex = 0;

        function renderLesson(lang, index) {
            const course = COURSES[lang];
            if (!course) return;
            const lessons = course.lessons;
            if (index >= lessons.length) {
                document.getElementById('lessonTitle').textContent = '🎉 Поздравляю!';
                document.getElementById('contentArea').innerHTML = `<div style="text-align:center;padding:20px;font-size:20px;">Ты прошёл все уроки по ${course.name}!<br>Отличная работа! 💪</div>`;
                document.getElementById('taskArea').classList.add('hidden');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('prevBtn').style.display = 'none';
                document.getElementById('skipBtn').style.display = 'none';
                document.getElementById('progressFill').style.width = '100%';
                return;
            }
            currentLessonIndex = index;
            currentLessonObj = lessons[index];
            state.lessonIndex[lang] = index;
            saveState();

            document.getElementById('lessonTitle').textContent = `Урок ${index+1}: ${currentLessonObj.title}`;
            document.getElementById('contentArea').innerHTML = `<div class="theory">${currentLessonObj.theory.replace(/\n/g, '<br>')}</div>`;
            document.getElementById('taskArea').classList.remove('hidden');
            document.getElementById('taskQuestion').textContent = '✏️ ' + currentLessonObj.task;
            document.getElementById('taskInstruction').innerHTML = currentLessonObj.instruction.replace(/\n/g, '<br>');
            document.getElementById('userInput').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('prevBtn').style.display = 'block';
            document.getElementById('skipBtn').style.display = 'block';
            document.getElementById('startBtn').style.display = 'none';

            const total = lessons.length;
            const done = state.completed[lang] || 0;
            document.getElementById('progressFill').style.width = Math.min(100, (done / total) * 100) + '%';

            if (state.lives <= 0) {
                document.getElementById('checkBtn').disabled = true;
                document.getElementById('checkBtn').style.opacity = '0.5';
                showFeedback('😵 У тебя закончились жизни! Подожди 10 минут или восстанови.', 'wrong');
            } else {
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('checkBtn').style.opacity = '1';
            }
        }

        function selectLanguage(lang) {
            state.currentLang = lang;
            menuScreen.classList.add('hidden');
            // lessonScreen уже виден, мы просто перерисовываем
            if (state.completed[lang] === 0 && state.lessonIndex[lang] === 0) {
                const course = COURSES[lang];
                document.getElementById('lessonTitle').textContent = `Вступление к ${course.name}`;
                document.getElementById('contentArea').innerHTML = `<div class="intro-text">${course.intro.replace(/\n/g, '<br>')}</div>`;
                document.getElementById('taskArea').classList.add('hidden');
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('prevBtn').style.display = 'none';
                document.getElementById('skipBtn').style.display = 'none';
                document.getElementById('progressFill').style.width = '0%';
            } else {
                renderLesson(lang, state.lessonIndex[lang]);
            }
            updateLivesDisplay();
        }

        function startLearning() { renderLesson(state.currentLang, state.lessonIndex[state.currentLang]); }

        function nextLesson() {
            const lang = state.currentLang;
            const nextIdx = state.lessonIndex[lang] + 1;
            renderLesson(lang, nextIdx);
        }
        function prevLesson() {
            const lang = state.currentLang;
            const prevIdx = state.lessonIndex[lang] - 1;
            if (prevIdx < 0) return;
            renderLesson(lang, prevIdx);
        }
        function skipLesson() {
            const lang = state.currentLang;
            const idx = state.lessonIndex[lang];
            const completed = state.completed[lang] || 0;
            if (idx >= completed) {
                state.completed[lang] = idx + 1;
                saveState();
            }
            nextLesson();
        }

        function checkAnswer() {
            if (state.lives <= 0) { showFeedback('Нет жизней! Восстанови или подожди.', 'wrong'); return; }
            if (!currentLessonObj) return;
            const userAns = document.getElementById('userInput').value.trim();
            if (!userAns) { showFeedback('✏️ Напиши ответ!', 'wrong'); return; }
            const normalize = s => s.replace(/\s+/g, ' ').trim();
            if (normalize(userAns) === normalize(currentLessonObj.answer)) {
                showFeedback('✅ Правильно! Отлично! 🎉', 'correct');
                const lang = state.currentLang;
                const idx = state.lessonIndex[lang];
                if (idx >= (state.completed[lang] || 0)) {
                    state.completed[lang] = idx + 1;
                    saveState();
                    const total = COURSES[lang].lessons.length;
                    const done = state.completed[lang];
                    document.getElementById('progressFill').style.width = Math.min(100, (done / total) * 100) + '%';
                }
            } else {
                state.lives--;
                state.lastLostTime = Date.now();
                saveState();
                updateLivesDisplay();
                showFeedback(`❌ Неверно. Осталось жизней: ${state.lives}`, 'wrong');
                if (state.lives <= 0) {
                    document.getElementById('checkBtn').disabled = true;
                    document.getElementById('checkBtn').style.opacity = '0.5';
                }
            }
        }

        function showHint() {
            if (currentLessonObj) showFeedback('💡 ' + currentLessonObj.hint, 'info');
        }
        function toggleReveal() {
            if (!currentLessonObj) return;
            const fb = document.getElementById('feedback');
            if (fb.textContent.includes(currentLessonObj.answer)) {
                fb.textContent = '';
                fb.className = 'feedback';
            } else {
                fb.textContent = '✅ Правильный ответ: ' + currentLessonObj.answer;
                fb.className = 'feedback correct';
            }
        }

        function restoreLife() {
            if (state.lives >= 3) { showFeedback('Жизней уже максимум!', 'info'); return; }
            state.lives++;
            state.lastLostTime = Date.now();
            saveState();
            updateLivesDisplay();
            showFeedback('❤️ Жизнь восстановлена!', 'correct');
        }

        function goToMenu() {
            menuScreen.classList.remove('hidden');
            // Не скрываем lessonScreen, просто показываем меню
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ — ПРИ ОТКРЫТИИ ПОКАЗЫВАЕМ HTML С ВСТУПЛЕНИЕМ
        // ============================================================
        loadState();
        updateLivesDisplay();

        // Автоматически выбираем HTML и показываем вступление
        selectLanguage('html');

        // Таймер для автовосстановления
        setInterval(() => {
            if (state.lives < 3 && (Date.now() - state.lastLostTime) >= 10 * 60 * 1000) {
                state.lives++;
                state.lastLostTime = Date.now();
                saveState();
                updateLivesDisplay();
                showFeedback('❤️ Жизнь восстановлена автоматически!', 'info');
            }
            updateLivesDisplay();
        }, 1000);

        // ============================================================
        //  ОБРАБОТЧИКИ
        // ============================================================
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', () => selectLanguage(btn.dataset.lang));
        });
        document.getElementById('backBtn').addEventListener('click', goToMenu);
        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('hintBtn').addEventListener('click', showHint);
        document.getElementById('revealBtn').addEventListener('click', toggleReveal);
        document.getElementById('nextBtn').addEventListener('click', nextLesson);
        document.getElementById('prevBtn').addEventListener('click', prevLesson);
        document.getElementById('skipBtn').addEventListener('click', skipLesson);
        document.getElementById('startBtn').addEventListener('click', startLearning);
        document.getElementById('restoreBtn').addEventListener('click', restoreLife);
        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });
    </script>
</body>
</html>
