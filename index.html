<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Обучальник программированию</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #f0f4fa;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .lives {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .lives span { color: #ef4444; }
        .restore-btn {
            background: #22c55e;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .timer { font-size: 14px; color: #94a3b8; margin-left: auto; }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .menu-btn {
            background: #1e293b;
            padding: 20px 10px;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 4px solid #f97316;
            text-align: center;
        }
        .menu-btn:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        .back-btn {
            background: none;
            border: none;
            color: #f97316;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            padding: 6px 0;
        }
        .progress-bar {
            background: #1e293b;
            height: 8px;
            border-radius: 20px;
            margin: 12px 0 16px;
            overflow: hidden;
        }
        .progress-fill {
            background: #f97316;
            height: 100%;
            width: 0%;
            transition: width 0.4s;
        }
        .lesson-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 24px 20px;
        }
        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .theory {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            border-left: 4px solid #f97316;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .task-box {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            margin-top: 12px;
        }
        .task-box .question {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .task-instruction {
            font-size: 15px;
            color: #e2e8f0;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            line-height: 1.7;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: 1px solid #334155;
        }
        .input-area input:focus { outline: 2px solid #f97316; }
        .input-area button {
            padding: 14px 24px;
            border: none;
            border-radius: 40px;
            background: #f97316;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            background: #334155;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            background: #475569;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .feedback {
            margin: 12px 0;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }
        .correct { color: #4ade80; }
        .wrong { color: #f87171; }
        .info { color: #60a5fa; }
        .intro-text {
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            border-left: 4px solid #f59e0b;
            white-space: pre-wrap;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
            text-align: center;
        }
        .code-example {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: monospace;
            color: #fbbf24;
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <div class="lives" id="livesDisplay">
        ❤️ <span id="livesCount">3</span>
        <button class="restore-btn" id="restoreBtn">+ Восстановить</button>
        <span class="timer" id="timerDisplay">⏳ 10:00</span>
    </div>

    <div id="menuScreen">
        <h1 style="text-align:center;">🧠 Обучальник</h1>
        <div style="text-align:center;color:#94a3b8;margin-bottom:20px;">Выбери язык</div>
        <div class="menu-grid">
            <button class="menu-btn" data-lang="html">🟧 HTML</button>
            <button class="menu-btn" data-lang="css">🟦 CSS</button>
            <button class="menu-btn" data-lang="js">🟨 JS</button>
            <button class="menu-btn" data-lang="python">🐍 Python</button>
        </div>
        <div style="text-align:center;color:#64748b;font-size:14px;margin-top:20px;">Прогресс и жизни сохраняются</div>
    </div>

    <div id="lessonScreen">
        <button class="back-btn" id="backBtn">← Назад к выбору</button>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="lesson-card">
            <div class="lesson-title" id="lessonTitle">Загрузка...</div>
            <div id="contentArea"></div>
            <div id="taskArea" class="hidden">
                <div class="task-box">
                    <div class="question" id="taskQuestion">Задание</div>
                    <div class="task-instruction" id="taskInstruction">Инструкция</div>
                    <div class="input-area">
                        <input type="text" id="userInput" placeholder="Введи код...">
                        <button id="checkBtn">Проверить</button>
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="action-buttons">
                        <button class="action-btn" id="hintBtn">💡 Подсказка</button>
                        <button class="action-btn" id="revealBtn">👀 Ответ</button>
                    </div>
                    <div class="nav-buttons">
                        <button class="nav-btn" id="prevBtn">◀ Назад</button>
                        <button class="nav-btn" id="skipBtn">⏩ Пропустить</button>
                        <button class="nav-btn" id="nextBtn">Следующий ▶</button>
                    </div>
                </div>
            </div>
            <button class="nav-btn" id="startBtn" style="display:none; width:100%;">🚀 Начать обучение</button>
        </div>
        <div class="footer">Учись и не теряй жизни 😉</div>
    </div>

    <script>
        // ================================================================
        //  БАЗА КУРСОВ — ПО 12 УРОКОВ НА ЯЗЫК С РАЗВЁРНУТОЙ ТЕОРИЕЙ
        // ================================================================
        const COURSES = {
            html: {
                name: 'HTML',
                intro: `🌟 **ЧТО ТАКОЕ HTML?**  
        HTML (HyperText Markup Language) — это язык разметки, который создаёт основу любой веб-страницы.  
        Он не является языком программирования, он просто описывает структуру: где заголовок, где абзац, где картинка.

        🧐 **ЗАЧЕМ ОН НУЖЕН?**  
        Без HTML браузер не поймёт, что показывать. Это как скелет человека — без него тело не держится.

        ⚠️ **ТРУДНОСТИ ДЛЯ НОВИЧКОВ:**  
        - Забывают закрывающие теги.  
        - Путают атрибуты (например, src у img и href у a).  
        - Не понимают вложенность: какой тег внутри какого должен находиться.

        📘 **КАК РАБОТАТЬ С КУРСОМ:**  
        В каждом уроке я даю теорию с примерами, затем задание.  
        Задание нужно выполнить, напечатав код в поле ввода.  
        Если ошибёшься — теряешь жизнь. Жизни восстанавливаются каждые 10 минут.  
        Можно использовать подсказку или посмотреть правильный ответ.  
        Удачи! 🚀`,
                lessons: [
                    { title: 'Тег <h1> — заголовок первого уровня', 
                      theory: `📚 **Теория:**  
        Заголовки нужны, чтобы выделить важные разделы.  
        <h1> — это самый главный заголовок на странице. Он должен быть только один.  
        Пишется так: <h1>текст</h1>.  
        Открывающий тег <h1> говорит браузеру: «здесь начинается заголовок».  
        Закрывающий тег </h1> говорит: «здесь заголовок заканчивается».  
        Внутри между ними пишется сам текст заголовка.

        🖐️ **КАК НАБРАТЬ НА КЛАВИАТУРЕ:**  
        1. Нажми клавишу < (Shift + Б на русской, или Shift + , на английской).  
        2. Напечатай h1.  
        3. Нажми > (Shift + Ю или Shift + .).  
        4. Напиши текст (например, Мой сайт).  
        5. Напечатай </ (Shift + Б и слеш).  
        6. Напечатай h1.  
        7. Нажми >.

        ✅ **Правильный пример:** <h1>Мой сайт</h1>`, 
                      task: 'Создай заголовок h1 с текстом "Мой сайт"', 
                      answer: '<h1>Мой сайт</h1>', 
                      hint: 'Открой h1, напиши текст, закрой h1', 
                      instruction: '1. <h1>\n2. Мой сайт\n3. </h1>' 
                    },
                    { title: 'Тег <p> — абзац', 
                      theory: `📚 **Теория:**  
        Абзац — это блок текста. Используй <p> ... </p> для каждого смыслового куска.  
        Браузер автоматически добавляет отступы между абзацами.  
        Пример: <p>Это первый абзац.</p> <p>Это второй абзац.</p>  
        Обрати внимание, что каждый абзац обёрнут в свой <p> и </p>.`, 
                      task: 'Создай абзац с текстом "Первый урок"', 
                      answer: '<p>Первый урок</p>', 
                      hint: 'Используй p', 
                      instruction: '<p>Первый урок</p>' 
                    },
                    { title: 'Теги <b> и <i> — жирный и курсив', 
                      theory: `📚 **Теория:**  
        Чтобы выделить слово, можно сделать его жирным <b> ... </b> или курсивным <i> ... </i>.  
        Они работают как обёртка: текст внутри становится жирным или наклонным.  
        Можно комбинировать: <b><i>жирный курсив</i></b>.  
        Пример использования: Это <b>очень</b> важно.`, 
                      task: 'Сделай слово "код" жирным', 
                      answer: '<b>код</b>', 
                      hint: 'Используй b', 
                      instruction: '<b>код</b>' 
                    },
                    { title: 'Тег <a> — ссылка', 
                      theory: `📚 **Теория:**  
        Ссылка — это кликабельный текст или картинка, который ведёт на другую страницу.  
        Пишется так: <a href="адрес">текст</a>.  
        Атрибут href задаёт URL, куда перейдёт пользователь.  
        Пример: <a href="https://ya.ru">Яндекс</a> — при клике откроет Яндекс.`, 
                      task: 'Сделай ссылку на google.com с текстом "Поиск"', 
                      answer: '<a href="https://google.com">Поиск</a>', 
                      hint: 'a href', 
                      instruction: '<a href="https://google.com">Поиск</a>' 
                    },
                    { title: 'Тег <img> — картинка', 
                      theory: `📚 **Теория:**  
        Картинка вставляется одиночным тегом <img> (без закрывающего).  
        Атрибут src указывает путь к файлу изображения.  
        Пример: <img src="photo.jpg"> — загрузит картинку photo.jpg.  
        Важно: имя файла должно быть правильным, иначе картинка не покажется.`, 
                      task: 'Вставь картинку с именем "cat.jpg"', 
                      answer: '<img src="cat.jpg">', 
                      hint: 'img src', 
                      instruction: '<img src="cat.jpg">' 
                    },
                    { title: 'Списки <ul> и <ol>', 
                      theory: `📚 **Теория:**  
        Списки бывают двух типов: ненумерованные (<ul>) и нумерованные (<ol>).  
        Внутри каждого списка используются элементы <li> (list item).  
        Пример ненумерованного списка:  
        <ul>  
          <li>Яблоко</li>  
          <li>Банан</li>  
        </ul>  
        Для нумерованного замени <ul> на <ol>.`, 
                      task: 'Создай нумерованный список с пунктами "Первый" и "Второй"', 
                      answer: '<ol><li>Первый</li><li>Второй</li></ol>', 
                      hint: 'ol и li', 
                      instruction: '<ol><li>Первый</li><li>Второй</li></ol>' 
                    },
                    { title: 'Таблицы <table>', 
                      theory: `📚 **Теория:**  
        Таблица создаётся с помощью <table>.  
        Строки — <tr> (table row), ячейки — <td> (table data).  
        Пример таблицы 2x2:  
        <table>  
          <tr><td>1</td><td>2</td></tr>  
          <tr><td>3</td><td>4</td></tr>  
        </table>  
        Каждая строка содержит ячейки.`, 
                      task: 'Создай таблицу с одной строкой и двумя ячейками: "X" и "Y"', 
                      answer: '<table><tr><td>X</td><td>Y</td></tr></table>', 
                      hint: 'table, tr, td', 
                      instruction: '<table><tr><td>X</td><td>Y</td></tr></table>' 
                    },
                    { title: 'Тег <hr> — горизонтальная линия', 
                      theory: `📚 **Теория:**  
        <hr> — это одиночный тег, который создаёт горизонтальную разделительную линию.  
        Используется для визуального разделения блоков.  
        Пример:  
        Текст до линии.  
        <hr>  
        Текст после линии.`, 
                      task: 'Вставь горизонтальную линию', 
                      answer: '<hr>', 
                      hint: 'hr', 
                      instruction: '<hr>' 
                    },
                    { title: 'Тег <br> — перенос строки', 
                      theory: `📚 **Теория:**  
        <br> — одиночный тег, который переносит текст на новую строку.  
        Отличие от <p>: <br> не создаёт отступов, просто переводит строку.  
        Пример:  
        Привет<br>Мир  
        Браузер покажет "Привет" и "Мир" на разных строках.`, 
                      task: 'Напиши "Привет" и с новой строки "Мир"', 
                      answer: 'Привет<br>Мир', 
                      hint: 'br', 
                      instruction: 'Привет<br>Мир' 
                    },
                    { title: 'Комментарии <!-- -->', 
                      theory: `📚 **Теория:**  
        Комментарии не видны на странице. Они нужны для заметок разработчика.  
        Пишутся так: <!-- текст -->.  
        Всё, что внутри, игнорируется браузером.  
        Пример: <!-- это важный блок -->.`, 
                      task: 'Напиши комментарий "скрыто"', 
                      answer: '<!-- скрыто -->', 
                      hint: '<!-- -->', 
                      instruction: '<!-- скрыто -->' 
                    },
                    { title: 'Вложенность тегов', 
                      theory: `📚 **Теория:**  
        Теги могут быть вложены друг в друга. Например, <p> содержит <b>жирный</b> текст.  
        Важно правильно закрывать: сначала закрывается внутренний, потом внешний.  
        Правильно: <p><b>жирный</b></p>  
        Неправильно: <p><b>жирный</p></b> — так нельзя.`, 
                      task: 'Создай абзац, в котором слово "важно" будет жирным', 
                      answer: '<p><b>важно</b></p>', 
                      hint: 'p и b', 
                      instruction: '<p><b>важно</b></p>' 
                    },
                    { title: 'Атрибуты тегов', 
                      theory: `📚 **Теория:**  
        Атрибуты добавляют информацию в открывающий тег.  
        Например, у <a> есть href, у <img> — src.  
        Атрибуты пишутся через пробел после имени тега: <a href="...">.  
        У одного тега может быть несколько атрибутов: <a href="..." target="_blank">.`, 
                      task: 'Создай ссылку на ya.ru с текстом "Яндекс"', 
                      answer: '<a href="https://ya.ru">Яндекс</a>', 
                      hint: 'a href', 
                      instruction: '<a href="https://ya.ru">Яндекс</a>' 
                    }
                ]
            },
            css: {
                name: 'CSS',
                intro: `🎨 **ЧТО ТАКОЕ CSS?**  
        CSS (Cascading Style Sheets) — это язык, который отвечает за внешний вид веб-страницы: цвета, шрифты, расположение элементов.  
        Без CSS все страницы выглядели бы как чёрно-белые документы.

        🧐 **ЗАЧЕМ ОН НУЖЕН?**  
        Чтобы сделать сайт красивым и удобным. CSS отделяет оформление от содержания.

        ⚠️ **ТРУДНОСТИ ДЛЯ НОВИЧКОВ:**  
        - Неправильное написание свойств (например, background-color vs background).  
        - Путают селекторы (как выбрать элемент).  
        - Забывают двоеточие или точку с запятой.

        📘 **КАК РАБОТАТЬ:**  
        Каждое задание — это написание CSS-правила. Вводи его точно с фигурными скобками и точкой с запятой.`,
                lessons: [
                    { title: 'Цвет текста (color)', 
                      theory: `📚 **Теория:**  
        Свойство color меняет цвет текста.  
        Значение можно указать как имя цвета (red, blue), hex-код (#ff0000) или rgb(255,0,0).  
        Правило CSS пишется так: селектор { свойство: значение; }  
        Например: p { color: red; } — все параграфы станут красными.`, 
                      task: 'Сделай заголовки h1 синими', 
                      answer: 'h1 { color: blue; }', 
                      hint: 'color', 
                      instruction: 'h1 { color: blue; }' 
                    },
                    { title: 'Цвет фона (background-color)', 
                      theory: `📚 **Теория:**  
        background-color заливает фон элемента указанным цветом.  
        Пример: body { background-color: #f0f0f0; } — серый фон страницы.`, 
                      task: 'Сделай фон страницы зелёным', 
                      answer: 'body { background-color: green; }', 
                      hint: 'background-color', 
                      instruction: 'body { background-color: green; }' 
                    },
                    { title: 'Размер шрифта (font-size)', 
                      theory: `📚 **Теория:**  
        font-size определяет размер текста. Единицы: px (пиксели), %, em.  
        Пример: p { font-size: 16px; } — размер шрифта параграфа 16 пикселей.`, 
                      task: 'Установи размер шрифта 24px для h1', 
                      answer: 'h1 { font-size: 24px; }', 
                      hint: 'font-size', 
                      instruction: 'h1 { font-size: 24px; }' 
                    },
                    { title: 'Жирность (font-weight)', 
                      theory: `📚 **Теория:**  
        font-weight управляет толщиной шрифта. Значения: normal (400), bold (700), или числа от 100 до 900.  
        Пример: p { font-weight: bold; } — все параграфы жирные.`, 
                      task: 'Сделай все абзацы жирными', 
                      answer: 'p { font-weight: bold; }', 
                      hint: 'font-weight', 
                      instruction: 'p { font-weight: bold; }' 
                    },
                    { title: 'Выравнивание (text-align)', 
                      theory: `📚 **Теория:**  
        text-align выравнивает текст внутри блока. Варианты: left, center, right, justify.  
        Пример: h1 { text-align: center; } — заголовок по центру.`, 
                      task: 'Выровняй h2 по центру', 
                      answer: 'h2 { text-align: center; }', 
                      hint: 'text-align',

        // ============================================================

        let state = {
            currentLang: 'html',
            lessonIndex: { html: 0, css: 0, js: 0, python: 0 },
            completed: { html: 0, css: 0, js: 0, python: 0 },
            lives: 3,
            lastLostTime: Date.now()
        };

        function loadState() {
            try {
                const saved = localStorage.getItem('learnState');
                if (saved) state = { ...state, ...JSON.parse(saved) };
            } catch(e) {}
        }
        function saveState() { localStorage.setItem('learnState', JSON.stringify(state)); }

        function updateLivesDisplay() {
            document.getElementById('livesCount').textContent = state.lives;
            const timerEl = document.getElementById('timerDisplay');
            if (state.lives >= 3) { timerEl.textContent = '✅ Максимум'; return; }
            const diff = 10 * 60 * 1000 - (Date.now() - state.lastLostTime);
            if (diff <= 0) timerEl.textContent = '⏳ 0:00 (доступно)';
            else {
                const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                timerEl.textContent = `⏳ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
        }

        function showFeedback(text, type='info') {
            const fb = document.getElementById('feedback');
            fb.textContent = text;
            fb.className = 'feedback ' + type;
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ УРОКОВ
        // ============================================================
        let currentLessonObj = null;
        let currentLessonIndex = 0;

        function renderLesson(lang, index) {
            const course = COURSES[lang];
            if (!course) return;
            const lessons = course.lessons;
            if (index >= lessons.length) {
                document.getElementById('lessonTitle').textContent = '🎉 Поздравляю!';
                document.getElementById('contentArea').innerHTML = `<div style="text-align:center;padding:20px;font-size:20px;">Ты прошёл все ${lessons.length} уроков по ${course.name}!<br>Отличная работа! 💪</div>`;
                document.getElementById('taskArea').classList.add('hidden');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('prevBtn').style.display = 'none';
                document.getElementById('skipBtn').style.display = 'none';
                document.getElementById('progressFill').style.width = '100%';
                return;
            }
            currentLessonIndex = index;
            currentLessonObj = lessons[index];
            state.lessonIndex[lang] = index;
            saveState();

            document.getElementById('lessonTitle').textContent = `Урок ${index+1}: ${currentLessonObj.title}`;
            document.getElementById('contentArea').innerHTML = `<div class="theory">${currentLessonObj.theory.replace(/\n/g, '<br>')}</div>`;
            document.getElementById('taskArea').classList.remove('hidden');
            document.getElementById('taskQuestion').textContent = '✏️ ' + currentLessonObj.task;
            document.getElementById('taskInstruction').innerHTML = currentLessonObj.instruction.replace(/\n/g, '<br>');
            document.getElementById('userInput').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('prevBtn').style.display = 'block';
            document.getElementById('skipBtn').style.display = 'block';
            document.getElementById('startBtn').style.display = 'none';

            const total = lessons.length;
            const done = state.completed[lang] || 0;
            document.getElementById('progressFill').style.width = Math.min(100, (done / total) * 100) + '%';

            if (state.lives <= 0) {
                document.getElementById('checkBtn').disabled = true;
                document.getElementById('checkBtn').style.opacity = '0.5';
                showFeedback('😵 У тебя закончились жизни! Подожди 10 минут или восстанови.', 'wrong');
            } else {
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('checkBtn').style.opacity = '1';
            }
        }

        function selectLanguage(lang) {
            state.currentLang = lang;
            menuScreen.classList.add('hidden');
            // Показываем вступление, если ещё не начат ни один урок
            if (state.completed[lang] === 0 && state.lessonIndex[lang] === 0) {
                const course = COURSES[lang];
                document.getElementById('lessonTitle').textContent = `Вступление к ${course.name}`;
                document.getElementById('contentArea').innerHTML = `<div class="intro-text">${course.intro.replace(/\n/g, '<br>')}</div>`;
                document.getElementById('taskArea').classList.add('hidden');

            renderLesson(lang, nextIdx);
        }
        function prevLesson() {
            const lang = state.currentLang;
            const prevIdx = state.lessonIndex[lang] - 1;
            if (prevIdx < 0) return;
            renderLesson(lang, prevIdx);
        }
        function skipLesson() {
            const lang = state.currentLang;
            const idx = state.lessonIndex[lang];
            const completed = state.completed[lang] || 0;
            if (idx >= completed) {
                state.completed[lang] = idx + 1;
                saveState();
            }
            nextLesson();
        }

                const lang = state.currentLang;
                const idx = state.lessonIndex[lang];
                if (idx >= (state.completed[lang] || 0)) {
                    state.completed[lang] = idx + 1;
                    saveState();
                    const total = COURSES[lang].lessons.length;
                    const done = state.completed[lang];
                    document.getElementById('progressFill').style.width = Math.min(100, (done / total) * 100) + '%';
                }
            } else {
                state.lives--;
                state.lastLostTime = Date.now();
                saveState();
                updateLivesDisplay();
                showFeedback(`❌ Неверно. Осталось жизней: ${state.lives}`, 'wrong');
                if (state.lives <= 0) {
                    document.getElementById('checkBtn').disabled = true;
                    document.getElementById('checkBtn').style.opacity = '0.5';
                }
            }
        }

        function showHint() {
            if (currentLessonObj) showFeedback('💡 ' + currentLessonObj.hint, 'info');
        }
        function toggleReveal() {
            if (!currentLessonObj) return;
            const fb = document.getElementById('feedback');
            if (fb.textContent.includes(currentLessonObj.answer)) {
                fb.textContent = '';
                fb.className = 'feedback';
            } else {
                fb.textContent = '✅ Правильный ответ: ' + currentLessonObj.answer;
                fb.className = 'feedback correct';
            }
        }

        function restoreLife() {
            if (state.lives >= 3) { showFeedback('Жизней уже максимум!', 'info'); return; }
            state.lives++;
            state.lastLostTime = Date.now();
            saveState();
            updateLivesDisplay();
            showFeedback('❤️ Жизнь восстановлена!', 'correct');
        }

        function goToMenu() {
            menuScreen.classList.remove('hidden');
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        loadState();
        updateLivesDisplay();
        // При загрузке показываем HTML с вступлением
        selectLanguage('html');

        // Автовосстановление каждую секунду
        setInterval(() => {
            if (state.lives < 3 && (Date.now() - state.lastLostTime) >= 10 * 60 * 1000) {
                state.lives++;
                state.lastLostTime = Date.now();
                saveState();
                updateLivesDisplay();
                showFeedback('❤️ Жизнь восстановлена автоматически!', 'info');
            }
            updateLivesDisplay();
        }, 1000);

        // Обработчики
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', () => selectLanguage(btn.dataset.lang));
        });
        document.getElementById('backBtn').addEventListener('click', goToMenu);
        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('hintBtn').addEventListener('click', showHint);
        document.getElementById('revealBtn').addEventListener('click', toggleReveal);
        document.getElementById('nextBtn').addEventListener('click', nextLesson);
        document.getElementById('prevBtn').addEventListener('click', prevLesson);
        document.getElementById('skipBtn').addEventListener('click', skipLesson);
        document.getElementById('startBtn').addEventListener('click', startLearning);
        document.getElementById('restoreBtn').addEventListener('click', restoreLife);
        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });
    </script>
</body>
</html>
